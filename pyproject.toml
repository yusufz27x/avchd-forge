[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avchd-forge"
version = "0.1.0"
description = "Remux AVC BDRemux releases into PS3-compatible AVCHD folder structures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yusuf Zeybek" }]
keywords = ["avchd", "bluray", "remux", "ps3", "tsmuxer", "ffmpeg", "pyside6"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video",
]
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-qt>=4.2", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["SIM108"]  # ternaries are not always clearer

[project.scripts]
avchd-forge = "avchdforge.__main__:main"

[project.urls]
Source = "https://github.com/user/avchd-forge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = ["e2e: integration tests that need real tsMuxeR/ffmpeg binaries and media"]
